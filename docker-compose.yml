services:

  # ── Container 1: Isaac ROS ──────────────────────────────────────────────
  isaac_ros:
    image: nvcr.io/nvidia/isaac/ros:isaac_ros_28556f8bc78a98822bd08b2d7c6fcf9b-arm64-jetpack
    container_name: isaac_ros
    runtime: nvidia
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      # DS mode: blank the image-baked FASTRTPS profile (it conflicts with DS client init).
      # rakhi24-desktop.local → 192.168.2.10 (ethernet via JioAirFiber switch, /etc/hosts)
      - FASTRTPS_DEFAULT_PROFILES_FILE=
      - ROS_DISCOVERY_SERVER=rakhi24-desktop.local:11811
    volumes:
      - /dev:/dev
      - ${HOME}/workspaces/isaac_ros-dev:/workspaces/isaac_ros-dev
      - ${HOME}/robot/config:/config
      - ${HOME}/robot/data:/data
      - ${HOME}/robot/models:/models
    restart: unless-stopped

  # ── Container 2: AI Stack ───────────────────────────────────────────────
  ai_stack:
    image: ai_stack:dev-1.0.0
    container_name: ai_stack
    runtime: nvidia
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      # DS mode: blank the image-baked FASTRTPS profile (it conflicts with DS client init).
      # rakhi24-desktop.local → 192.168.2.10 (ethernet via JioAirFiber switch, /etc/hosts)
      - FASTRTPS_DEFAULT_PROFILES_FILE=
      - ROS_DISCOVERY_SERVER=rakhi24-desktop.local:11811
      # /opt/venv: jetson-containers packages (torch, whisper, kokoro …)
      # /usr/lib/python3/dist-packages: colcon_ros + catkin_pkg (needed for ros2 CLI)
      - PYTHONPATH=/opt/venv/lib/python3.12/site-packages:/usr/lib/python3/dist-packages
      # PipeWire socket — lets the container use BT audio via the host PipeWire session
      - PIPEWIRE_REMOTE=/run/user/2002/pipewire-0
    volumes:
      - ${HOME}/robot/ai_ws:/workspaces/ai_ws
      - ${HOME}/robot/config:/config
      - ${HOME}/robot/data:/data
      - ${HOME}/robot/models:/model_store
      # PipeWire socket — BT audio from host session; PIPEWIRE_REMOTE must point here
      # Long-form bind required: short-form fails when PipeWire is running (socket != dir)
      - type: bind
        source: /run/user/2002/pipewire-0
        target: /run/user/2002/pipewire-0
      # Bind-mount /dev/snd as a directory so USB audio devices hot-plugged after
      # container start are visible (devices: takes a static snapshot at start time)
      - /dev/snd:/dev/snd
      # Bind-mount whole /dev so the Logitech USB camera's /dev/videoN nodes (used by
      # camera_node via V4L2) are visible — incl. ones hot-plugged after start.
      # privileged alone lifts the cgroup device limit but doesn't import host device nodes.
      - /dev:/dev
    restart: unless-stopped

  # micro-ROS agent runs on Pi5:
  #   ros2 run micro_ros_agent micro_ros_agent udp4 --port 8888
