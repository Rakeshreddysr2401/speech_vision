stt_node:
  ros__parameters:
    model_size: "base.en"       # tiny.en / base.en / small.en / medium.en
    device: "cuda"              # cuda or cpu
    compute_type: "float16"     # float16 (cuda) or int8 (cpu)
    sample_rate: 16000
    vad_aggressiveness: 2       # 0=least aggressive, 3=most aggressive
    language: "en"
    input_device_index: -1

tts_node:
  ros__parameters:
    engine: "kokoro"            # "kokoro" or "piper" — only change this line to switch
    output_device_index: 0

    kokoro:
      model: "af_heart"         # kokoro voice: af_heart, af_bella, am_adam, bf_emma ...
      speed: 1.0
      device: "cuda"
      sample_rate: 24000
      lang: "a"                 # a=American English, b=British English

    piper:
      model_path: "/models/piper/en_US-lessac-medium.onnx"
      config_path: "/models/piper/en_US-lessac-medium.onnx.json"
      speed: 1.0
      sample_rate: 22050
      piper_bin: "piper"        # path to piper binary if not on PATH
