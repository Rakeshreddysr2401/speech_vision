stt_node:
  ros__parameters:
    mic_preference: "auto"       # auto | usb | bluetooth | <substring match>
    silence_timeout: 0.8         # seconds of silence that finalises an utterance
    min_speech_duration: 0.3     # minimum seconds of speech before transcribing
                                 # (kept low so short safety commands like "stop"/"no"
                                 #  survive; VAD still gates pure noise)
    vad_aggressiveness: 3        # WebRTC VAD mode 0–3 (0=permissive, 3=aggressive)
    chunk_frames: 1280           # audio chunk size in samples (80ms at 16kHz)

    # ── Backend selection ────────────────────────────────────────────────────
    # whisper_cuda: openai-whisper on CUDA (~0.4s, recommended)
    # faster_whisper: ctranslate2 on CPU (~3-4s, fallback)
    stt_backend: "whisper_cuda"

    # ── Model params (used by both backends) ─────────────────────────────────
    model: "small"               # tiny(0.15s) | base(0.4s) | small | medium
    language: "en"

    # ── faster_whisper only ──────────────────────────────────────────────────
    device: "cpu"
    compute_type: "int8"
    download_root: "/model_store/whisper_cache"

    # ── Stop-keyword spotter ("barge-in lite") ───────────────────────────────
    # While the robot speaks, listen ONLY for short bursts (≤1.5s) and check
    # for the keyword — "stop" halts TTS (and wheels, via the Pi5) mid-reply.
    stop_spotter: true
    stop_keyword: "stop"

    # ── Wake-word gate ───────────────────────────────────────────────────────
    # Only utterances addressed to the robot reach the brain: they must start
    # (or end) with a wake alias, OR fall inside the attention window after the
    # robot last spoke / was addressed (follow-ups need no name). Ignored
    # utterances are logged with their transcript — tune wake_aliases from
    # those logs (Whisper spells "Rakhi" many ways).
    wake_word: true
    wake_aliases: ["rakhi", "rakhee", "raki", "rakki", "rocky", "rocki", "roki"]
    attention_s: 15.0

tts_node:
  ros__parameters:
    speaker_preference: "auto"   # auto | usb | bluetooth | <substring match>
    sample_rate: 22050

    # ── Backend selection ────────────────────────────────────────────────────
    tts_backend: "kokoro"

    # ── Kokoro params ────────────────────────────────────────────────────────
    voice: "af_heart"            # af_heart | af_bella | am_adam | am_michael | ...
    speed: 1.0

    # ── Streamed utterances ──────────────────────────────────────────────────
    # The brain streams a reply as sentence chunks ending with a <|eou|> marker;
    # /voice/tts_speaking stays True (mic muted) until the marker is played out.
    # If the brain dies mid-stream, release the mic after this many idle seconds.
    eou_timeout: 8.0
    # Must match stt_node's stop_keyword — used to ignore self-echo (the robot
    # itself saying the word while speaking).
    stop_keyword: "stop"
