stt_node:
  ros__parameters:
    # ── Audio input ──────────────────────────────────────────────────────────
    # audio_source: PipeWire capture target. "ec_mic" = the echo-cancelled
    # source created by the host's 99-echo-cancel.conf (mic minus the robot's
    # own TTS/music). "" = legacy device search via mic_preference.
    audio_source: "ec_mic"
    mic_preference: "auto"       # legacy path only (audio_source: "")
    chunk_frames: 1280           # 80ms at 16kHz

    # ── Endpointing ──────────────────────────────────────────────────────────
    silence_timeout: 0.8         # seconds of silence that finalises an utterance
    min_speech_duration: 0.3     # minimum seconds of speech before transcribing
    vad_backend: "silero"        # silero (neural, noise-robust) | webrtc (legacy)
    vad_aggressiveness: 3        # webrtc fallback mode 0-3

    # ── STT backend ──────────────────────────────────────────────────────────
    stt_backend: "whisper_cuda"  # whisper_cuda (~0.4s) | faster_whisper (CPU)
    model: "small"
    language: "en"
    device: "cpu"                # faster_whisper only
    compute_type: "int8"         # faster_whisper only
    download_root: "/model_store/whisper_cache"

    # ── Wake word (primary gate — audio level, BEFORE STT) ───────────────────
    # openwakeword: neural KWS scores every 80ms chunk; only wake-opened
    # windows are ever transcribed. Falls back to "transcript" automatically
    # if openwakeword/models are missing.
    wake_backend: "openwakeword"
    # Model names in /model_store/wake (or absolute paths).
    # Bootstrap: hey_jarvis_v0.1 (pretrained — say "hey jarvis").
    # Once the custom model is trained (JETSON_VOICE_UPGRADE.md): ["hey_rakhi"]
    wake_models: ["hey_jarvis_v0.1"]
    wake_threshold: 0.5          # tune 0.3 (sensitive) – 0.7 (strict)
    capture_window_s: 8.0        # listening window after a wake trigger
    attention_s: 6.0             # follow-up window after the robot speaks
                                 # (short: the neural wake word is reliable —
                                 #  the old 15s compensated for transcript matching)

    # ── Transcript gate (secondary check + alias stripping) ──────────────────
    wake_word: true
    wake_aliases: ["rakhi", "rakhee", "raki", "rakki", "rocky", "rocki", "roki", "jarvis"]

    # ── Stop keyword (during TTS/music, on echo-cancelled audio) ─────────────
    # Acts locally first (music + TTS halt on the Jetson, <400ms), then
    # publishes /voice/tts_stop so the Pi5 stops the wheels too.
    stop_spotter: true
    stop_keyword: "stop"

tts_node:
  ros__parameters:
    speaker_preference: "auto"   # legacy ALSA path only
    # PipeWire playback target — 'ec_speaker' routes TTS through the AEC
    # echo-cancel sink (REQUIRED for barge-in/stop to hear over the robot).
    audio_sink: "ec_speaker"
    sample_rate: 22050

    tts_backend: "kokoro"
    voice: "af_heart"            # af_heart | af_bella | am_adam | am_michael | ...
    speed: 1.0

    # The brain streams a reply as sentence chunks ending with a <|eou|> marker;
    # /voice/tts_speaking stays True until the marker is played out.
    eou_timeout: 8.0
    stop_keyword: "stop"         # self-echo guard (harmless with AEC, kept)

music_node:
  ros__parameters:
    # Music must also play through the AEC sink so the mic hears the user
    # (wake word + "stop") over the music.
    audio_sink: "ec_speaker"
    default_volume: 70           # 0-100
    duck_percent: 25             # % of current volume while the robot speaks
