stt_node:
  ros__parameters:
    mic_preference: "auto"       # auto | usb | bluetooth | <substring match>
    silence_timeout: 0.8         # seconds of silence that finalises an utterance
    min_speech_duration: 0.5     # minimum seconds of speech before transcribing
    vad_aggressiveness: 3        # WebRTC VAD mode 0–3 (0=permissive, 3=aggressive)
    chunk_frames: 1280           # audio chunk size in samples (80ms at 16kHz)

    # ── Backend selection ────────────────────────────────────────────────────
    # whisper_cuda: openai-whisper on CUDA (~0.4s, recommended)
    # faster_whisper: ctranslate2 on CPU (~3-4s, fallback)
    stt_backend: "whisper_cuda"

    # ── Model params (used by both backends) ─────────────────────────────────
    model: "base"                # tiny(0.15s) | base(0.4s) | small | medium
    language: "en"

    # ── faster_whisper only ──────────────────────────────────────────────────
    device: "cpu"
    compute_type: "int8"
    download_root: "/model_store/whisper_cache"

tts_node:
  ros__parameters:
    speaker_preference: "auto"   # auto | usb | bluetooth | <substring match>
    sample_rate: 22050

    # ── Backend selection ────────────────────────────────────────────────────
    tts_backend: "kokoro"

    # ── Kokoro params ────────────────────────────────────────────────────────
    voice: "af_heart"            # af_heart | af_bella | am_adam | am_michael | ...
    speed: 1.0
